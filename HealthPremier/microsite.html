<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Indian Bank Health Care Premier</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Indian Bank Health Care Premier</h1>
      <p class="sub">Choose Your Health Journey</p>
      <div id="packages" class="packages"></div>
      <div class="card">
        <div class="label">Family</div>
        <div id="family" class="chips"></div>
        <div class="label">Age Band</div>
        <div id="age" class="chips"></div>
        <div class="label">Sum Insured</div>
        <div id="si" class="chips"></div>
      </div>
      <div class="card">
        <div id="perdayBox" class="heroBox">
          <div id="perday" class="big">₹ --</div>
          <div>per day</div>
          <div id="anchor">Affordable protection</div>
        </div>
        <div class="card">
          <div id="recommendationTitle">⭐ SMART HEALTH PLUS</div>

          <div id="recommendationText">Today's sensible family cover</div>
        </div>
        <div id="premium" class="premium">₹ --</div>
        <button onclick="shareQuote()">Share on WhatsApp</button>
      </div>
    </div>
    <script src="data/rates.js"></script>
    <script src="js/packages.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
